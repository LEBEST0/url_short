services:
  - type: web
    name: pyshort-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BASE_URL
        sync: false   # tu le renseigneras manuellement dans le dashboard Render
      - key: DATABASE_URL
        value: sqlite:///./shortener.db