<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <title>PyShort — Paramètres</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .card-header .logo { font-size: 24px; }
    .card-header h1 { font-size: 18px; font-weight: 700; color: #38bdf8; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #0ea5e9; }

    .hint {
      font-size: 11px;
      color: #475569;
      margin-top: 6px;
    }

    .btn-save {
      margin-top: 24px;
      width: 100%;
      padding: 11px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #38bdf8; }

    .toast {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      background: #052e16;
      border: 1px solid #16a34a;
      border-radius: 8px;
      font-size: 13px;
      color: #86efac;
      text-align: center;
    }
    .toast.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <span class="logo">🔗</span>
      <h1>PyShort — Paramètres</h1>
    </div>

    <label for="api-url">URL de l'API backend</label>
    <input
      type="text"
      id="api-url"
      placeholder="http://localhost:8000"
    />
    <p class="hint">
      Adresse de ton serveur FastAPI. Ex : <code>https://mon-api.render.com</code>
    </p>

    <button class="btn-save" id="btn-save">💾 Enregistrer</button>

    <div class="toast" id="toast">✅ Paramètres sauvegardés !</div>
  </div>

  <script src="options.js"></script>
</body>
</html>
